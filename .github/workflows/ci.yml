name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  AGAVE_VERSION: v4.3.0
  ANCHOR_VERSION: 1.2.1

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install Agave + Anchor
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          command -v avm || cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install $ANCHOR_VERSION && avm use $ANCHOR_VERSION
      - run: anchor build
      # program tests on LiteSVM
      - run: cargo test -p soladb
      - uses: actions/upload-artifact@v4
        with:
          name: soladb-program
          path: |
            target/deploy/soladb.so
            target/idl/soladb.json

  sdk-app:
    runs-on: ubuntu-latest
    needs: program
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: soladb-program
          path: target
      - name: IDL in the repo matches the built program
        run: diff <(jq -S . target/idl/soladb.json) <(jq -S . idl/soladb.json)
      - run: npm ci
      - run: npm run build:sdk
      - name: Local validator with the program (v1 transactions need Agave ≥ 4.2)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          SOLADB_SO=target/deploy/soladb.so bash scripts/localnet.sh > validator.log 2>&1 &
          for i in $(seq 1 60); do solana -u localhost cluster-version && break; sleep 1; done
      # SDK unit tests + end-to-end tests against the validator
      - run: npm run test:sdk
      - run: npm run app:build

  node:
    runs-on: ubuntu-latest
    # rocksdb's prebuilt binary crashes on recent glibc (ubuntu-latest) and its
    # sources no longer compile with GCC 13+, so build on Debian bookworm
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build:sdk
      - run: npm ci
        working-directory: soladb-node
      - run: npm run build && npm test
        working-directory: soladb-node

  # S3 / Postgres drivers against real MinIO and Postgres
  # (soladb-node/test/storage-integration.spec.ts)
  node-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soladb
          POSTGRES_PASSWORD: soladb-ci
          POSTGRES_DB: soladb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soladb -d soladb"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://soladb:soladb-ci@localhost:5432/soladb
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: soladb-ci
      S3_ACCESS_KEY_ID: soladb-ci
      S3_SECRET_ACCESS_KEY: soladb-ci-secret
    steps:
      - uses: actions/checkout@v4
      # A service container cannot be given a command ("server /data")
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            soladb-node/package-lock.json
      - run: npm ci && npm run build:sdk
      # On the runner (not node:22-bookworm, which has no Docker for MinIO):
      # --ignore-scripts skips rocksdb's native install, which these drivers
      # never load (its prebuild crashes on this glibc, its sources need GCC < 13)
      - run: npm ci --ignore-scripts
        working-directory: soladb-node
      # Creates the bucket, works under a random prefix / schema, cleans up
      - run: npx jest --ci storage-integration
        working-directory: soladb-node

  node-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f soladb-node/Dockerfile -t soladb-node:ci .
      - run: docker run --rm soladb-node:ci node -e "require('rocksdb'); require('oracledb'); require('pg'); require('@aws-sdk/client-s3'); require('@soladb/sdk')"
